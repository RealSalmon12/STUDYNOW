name: Build apps

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Gradle 배포 서버가 가끔 느리거나 504를 내서 몇 번 다시 시도
          for i in 1 2 3; do ./gradlew --version && break; echo "retry $i"; sleep 15; done
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-android-apk
          path: android/app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build FocusLock.exe
        working-directory: windows
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --noconsole --name FocusLock focus_lock.py
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-windows-exe
          path: windows/dist/FocusLock.exe
