name: Build apps

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Gradle/Maven 서버가 가끔 504나 타임아웃을 내서 몇 번 다시 시도
          # (이미 받은 파일은 캐시에 남아 다음 시도에서 이어감)
          for i in 1 2 3 4 5; do
            ./gradlew assembleRelease --no-daemon && exit 0
            echo "retry $i"; sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-android-apk
          path: android/app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build FocusLock.exe
        working-directory: windows
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --noconsole --name FocusLock focus_lock.py
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-windows-exe
          path: windows/dist/FocusLock.exe
